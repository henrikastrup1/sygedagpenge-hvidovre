<!DOCTYPE html>
<html lang="da" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sygedagpenge Hvidovre 2026</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700;1,300&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
:root{--green:#1A4D2E;--green-mid:#2E7D54;--gold:#C9973A;--gold-lite:#E8C06A;--red:#C0392B;--bg:#F9F6F0;--card:#FFFFFF;--text:#1C1C1A;--mid:#4A4A44;--muted:#8A8A7E;--border:#E2DDD4;--radius:10px;--shadow:0 2px 20px rgba(26,77,46,0.07)}
[data-theme="dark"]{--green:#2E7D54;--green-mid:#3D9E6A;--gold:#E8C06A;--red:#E74C3C;--bg:#1A1A1A;--card:#2A2A2A;--text:#E8E6E0;--mid:#B0AFA8;--muted:#6A6A5E;--border:#3A3A34;--shadow:0 2px 20px rgba(0,0,0,0.3)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.container{max-width:1100px;margin:0 auto;padding:0 20px 40px}
.header{background:var(--green);padding:28px 20px 50px;position:relative;overflow:hidden;margin-bottom:-20px}
.header::after{content:'';position:absolute;bottom:-60px;right:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.06) 0%,transparent 70%)}
.header-inner{max-width:1100px;margin:0 auto;padding:0 20px;position:relative;z-index:1}
.header .eyebrow{font-family:'DM Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.15em;color:rgba(255,255,255,.5);margin-bottom:6px}
.header h1{font-family:'DM Serif Display',serif;font-size:30px;color:#fff;line-height:1.2}
.header h1 em{color:var(--gold-lite);font-style:italic}
.header .sub{font-size:13px;color:rgba(255,255,255,.6);margin-top:6px}
.toolbar{display:flex;align-items:center;gap:8px;padding:10px 0;margin-bottom:16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.toolbar .btn{font-size:13px;padding:5px 14px;background:transparent;border:1.5px solid var(--border);border-radius:6px;cursor:pointer;color:var(--text);transition:all .2s;font-family:'DM Sans',sans-serif}
.toolbar .btn:hover{border-color:var(--green);color:var(--green)}
.toolbar .date{font-family:'DM Mono',monospace;font-size:10.5px;color:var(--muted);margin-left:auto;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.card h2{font-family:'DM Serif Display',serif;font-size:18px;color:var(--text);margin-bottom:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 .hint{font-family:'DM Mono',monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);background:var(--bg);padding:2px 8px;border-radius:4px;font-weight:400}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.kpi-card{background:var(--card);border-left:4px solid var(--green);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.kpi-card.gld{border-color:var(--gold)}
.kpi-card.red{border-color:var(--red)}
.kpi-card .label{font-family:'DM Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.kpi-card .value{font-family:'DM Serif Display',serif;font-size:30px;color:var(--text);line-height:1.1;margin:2px 0}
.kpi-card .desc{font-size:12px;color:var(--mid);line-height:1.3}
.kpi-card .change{font-size:12px;margin-top:2px;font-weight:500}
.kpi-card .change.down{color:var(--green)}
.kpi-card .change.up{color:var(--red)}
.chart-box{height:350px;margin:10px 0}

/* Clickable kommune badges */
.kom-badges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.kom-badge{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:20px;font-size:13px;font-weight:500;cursor:pointer;border:2px solid;transition:all .2s;user-select:none;font-family:'DM Sans',sans-serif}
.kom-badge:hover{opacity:.85}
.kom-badge .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.kom-badge .check{font-size:11px;transition:transform .2s}
.kom-badge.hidden{opacity:.35;background:transparent!important;border-color:var(--border)!important;color:var(--muted)!important}
.kom-badge.hidden .check{transform:scale(.7)}

/* Tabel */
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
th{font-family:'DM Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:8px 12px;text-align:right;border-bottom:2px solid var(--border);white-space:nowrap}
td{padding:8px 12px;text-align:right;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
tr:hover td{background:rgba(46,125,84,.04)}
.highlight{background:rgba(46,125,84,.06)!important}
.highlight td:first-child::after{content:" ★";color:var(--gold);font-size:11px}
.pos{color:var(--green);font-weight:500}
.neg{color:var(--red);font-weight:500}
.footer{text-align:center;padding:20px 0;font-size:11px;color:var(--muted);border-top:1px solid var(--border);margin-top:16px}
.footer a{color:var(--green);text-decoration:none}

/* Underretning om click-to-toggle */
.click-hint{font-size:12px;color:var(--muted);margin-bottom:8px;font-family:'DM Sans',sans-serif}
</style>
</head>
<body>
<div class="header">
<div class="header-inner">
<div class="eyebrow">Jobindsats · Y07A02</div>
<h1>Sygedagpengemodtagere <em>2026</em></h1>
<div class="sub">Fuldtidspersoner · Hvidovre + 5 benchmark-kommuner · Seneste data: marts 2026</div>
</div>
</div>
<div class="container">

<div class="kpi-row" id="kpiRow"></div>

<div class="toolbar">
<button class="btn" onclick="toggleDark()">🌙 Toggle dark</button>
<button class="btn" onclick="expo...SV</button>
<span class="date">Opdateret: maj 2026 · Kilde: Jobindsats API</span>
</div>

<div class="card">
<h2>Fuldtidspersoner på sygedagpenge <span class="hint">2026</span></h2>
<p class="click-hint">👆 Klik på en kommune for at vise/skjule — Hvidovre er altid synlig</p>
<div class="kom-badges" id="komBadges"></div>
<div class="chart-box"><canvas id="sygeChart"></canvas></div>
</div>

<div class="card">
<h2>Data <span class="hint">Alle kommuner</span></h2>
<div style="overflow-x:auto"><table><thead id="th-data"></thead><tbody id="tb-data"></tbody></table></div>
</div>

<div class="card">
<h2>📈 Analyse</h2>
<div id="insights"></div>
</div>

<div class="footer">
<a href="https://www.jobindsats.dk/databank/">Jobindsats</a> · API y07a02 ·
<a href="https://github.com/henrikastrup1" target="_blank">GitHub</a>
</div>
</div>

<script>
const DATA={};
const MONTHS=["Jan","Feb","Mar"];
const ALL=["Hvidovre","Brøndby","Rødovre","Ballerup","Gladsaxe","Herlev"];
const CLR={"Hvidovre":"#1A4D2E","Brøndby":"#C0392B","Rødovre":"#C9973A","Ballerup":"#2E7D54","Gladsaxe":"#7B5EA7","Herlev":"#E8C06A"};
const RAW={"Hvidovre":[791,788,759],"Brøndby":[566,559,524],"Rødovre":[558,546,496],"Ballerup":[856,859,806],"Gladsaxe":[782,791,734],"Herlev":[429,426,406]};

// Build DATA object
ALL.forEach(k=>{DATA[k]={}; MONTHS.forEach((m,i)=>{DATA[k][m]=RAW[k][i];})});

// State: which communes are visible (Hvidovre always visible)
let visible={...Object.fromEntries(ALL.map(k=>[k,true]))};
// Hvidovre is locked visible
let hvidovreLocked=true;

// KPI
const h=RAW.Hvidovre;
const chg=h[2]-h[0];
const pct=((chg/h[0])*100).toFixed(1);
document.getElementById("kpiRow").innerHTML=
`<div class="kpi-card"><div class="label">Jan 2026</div><div class="value">${h[0]}</div><div class="desc">Fuldtidspersoner</div></div>
<div class="kpi-card gld"><div class="label">Mar 2026</div><div class="value">${h[2]}</div><div class="desc">Seneste måned</div></div>
<div class="kpi-card ${chg<0?'red':''}"><div class="label">Ændring</div><div class="value">${chg<0?'':'-'}${Math.abs(chg)}</div><div class="change ${chg<0?'down':'up'}">${chg<0?'':'+'}${pct}%</div></div>
<div class="kpi-card"><div class="label">Forskel til Brøndby</div><div class="value">${h[2]-RAW.Brøndby[2]}</div><div class="desc">Flere/ftr. i Hvidovre (mar)</div></div>`;

// Build badges
const badgeDiv=document.getElementById("komBadges");
ALL.forEach(k=>{
const b=document.createElement("button");
b.className="kom-badge"+(k==="Hvidovre"?"":"");
b.id="badge-"+k;
b.style.borderColor=CLR[k];
b.style.background=CLR[k]+"12";
b.style.color=CLR[k];
b.innerHTML=`<span class="dot" style="background:${CLR[k]}"></span>${k} <span class="check">${k==="Hvidovre"?"🔒":"✓"}</span>`;
if(k!=="Hvidovre"){
b.onclick=()=>toggleKom(k);
}
badgeDiv.appendChild(b);
});

function toggleKom(k){
if(k==="Hvidovre")return;
visible[k]=!visible[k];
const badge=document.getElementById("badge-"+k);
if(visible[k]){
badge.classList.remove("hidden");
badge.querySelector(".check").textContent="✓";
}else{
badge.classList.add("hidden");
badge.querySelector(".check").textContent="✕";
}
updateChart();
updateTable();
}

// Chart
let chart=null;
function updateChart(){
const ds=[];
ALL.forEach(k=>{
if(!visible[k])return;
const lk=k;
ds.push({
label:lk,
data:MONTHS.map(m=>DATA[lk][m]),
borderColor:CLR[lk],
backgroundColor:CLR[lk]+"1A",
fill:true,
tension:.3,
pointRadius:lk==="Hvidovre"?5:4,
borderWidth:lk==="Hvidovre"?3:2
});
});
if(chart)chart.destroy();
chart=new Chart(document.getElementById("sygeChart"),{type:"line",data:{labels:MONTHS,datasets:ds},options:{
responsive:true,maintainAspectRatio:false,
plugins:{legend:{position:"bottom",labels:{font:{family:"DM Sans",size:11},usePointStyle:true,filter:function(item){return visible[item.text];}}},
tooltip:{callbacks:{label:ctx=>`${ctx.dataset.label}: ${ctx.raw}`}}},
scales:{x:{grid:{display:false},ticks:{font:{family:"DM Sans",size:10}}},
y:{beginAtZero:false,grid:{color:"rgba(0,0,0,.05)"},ticks:{font:{family:"DM Sans",size:10}}}}}});
}

// Table
function updateTable(){
let th="<tr><th>Kommune</th>";
MONTHS.forEach(m=>{th+=`<th>${m}</th>`;});
th+="<th>Ændring</th></tr>";
document.getElementById("th-data").innerHTML=th;
let tb="";
ALL.forEach(k=>{
if(!visible[k])return;
const cls=k==="Hvidovre"?' class="highlight"':"";
const vals=RAW[k];
tb+=`<tr${cls}><td>${k}</td>`;
vals.forEach(v=>tb+=`<td>${v}</td>`);
const c=vals[2]-vals[0], pp=((c/vals[0])*100).toFixed(1);
tb+=c<0?`<td class="pos">${c} (${pp}%)</td>`:`<td class="neg">+${c} (+${pp}%)</td>`;
tb+="</tr>";
});
document.getElementById("tb-data").innerHTML=tb;
}

// Dark mode
function toggleDark(){
const d=document.documentElement;
d.getAttribute("data-theme")==="dark"?d.removeAttribute("data-theme"):d.setAttribute("data-theme","dark");
}

// CSV
function exportCSV(){
let csv="Kommune;Jan;Feb;Mar;Ændring\n";
ALL.forEach(k=>{
if(!visible[k])return;
const v=RAW[k], c=v[2]-v[0];
csv+=`${k};${v.join(";")};${c}\n`;
});
const b=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"});
const a=document.createElement("a");
a.href=URL.createObjectURL(b);a.download="sygedagpenge_hvidovre_2026.csv";a.click();
}

// Insights
document.getElementById("insights").innerHTML=
`<div class="insight" style="border-left:4px solid var(--green);background:rgba(46,125,84,.05);border-radius:var(--radius);padding:14px 18px;margin-bottom:10px;display:flex;gap:12px;align-items:flex-start">
<div style="font-size:18px;flex-shrink:0;line-height:1.3">📉</div>
<div><div style="font-weight:600;font-size:13px;margin-bottom:2px">Faldende tendens i Hvidovre</div>
<div style="font-size:12px;color:var(--mid);line-height:1.5">Antallet af fuldtidspersoner på sygedagpenge i Hvidovre er faldet fra 791 i januar til 759 i marts 2026 — et fald på 32 personer (-4,0 %). Rødovre har det største relative fald (-11,1 %), mens Gladsaxe ligger stabilt.</div></div></div>
<div class="insight" style="border-left:4px solid var(--gold);background:rgba(201,151,58,.06);border-radius:var(--radius);padding:14px 18px;margin-bottom:10px;display:flex;gap:12px;align-items:flex-start">
<div style="font-size:18px;flex-shrink:0;line-height:1.3">📊</div>
<div><div style="font-weight:600;font-size:13px;margin-bottom:2px">Ballerup har flest sygedagpengemodtagere</div>
<div style="font-size:12px;color:var(--mid);line-height:1.5">Ballerup topper med 806 fuldtidspersoner i marts, efterfulgt af Gladsaxe (734) og Hvidovre (759). Herlev har færrest med 406. Brøndby ligger lavest blandt de større kommuner.</div></div></div>
<div class="insight" style="border-left:4px solid var(--red);background:rgba(192,57,43,.05);border-radius:var(--radius);padding:14px 18px;display:flex;gap:12px;align-items:flex-start">
<div style="font-size:18px;flex-shrink:0;line-height:1.3">ℹ️</div>
<div><div style="font-weight:600;font-size:13px;margin-bottom:2px">Data fra Jobindsats</div>
<div style="font-size:12px;color:var(--mid);line-height:1.5">Tallene er hentet via Jobindsats API (tabel y07a02) og viser antal fuldtidspersoner på sygedagpenge. Fuldtidspersoner omregner delvist sygemeldte til fuldtidsekvivalenter. Data dækker jan-mar 2026.</div></div></div>`;

// Init
updateChart();
updateTable();
</script>
</body>
</html>
